<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - College Complaint System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%); min-height: 100vh;">

    <div class="auth-wrapper">
        <div class="auth-card wide">
            <div class="auth-header">
                <img src="/images/cu_logo.png" alt="CU Logo" class="brand-logo-card">
                <h1>Student Registration</h1>
                <p>Create an account to submit complaints and follow up on inquiries</p>
            </div>

            <form id="regForm" onsubmit="handleRegister(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="name">Full Name *</label>
                        <input type="text" id="name" class="form-control" placeholder="e.g. Rahul Sharma" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">College Email Address *</label>
                        <input type="email" id="email" class="form-control" placeholder="e.g. rahul@student.edu" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="department">Department / Branch *</label>
                        <select id="department" class="form-control" required>
                            <option value="">-- Select Department --</option>
                            <option value="Computer Science">Computer Science & Engineering</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Electronics">Electronics & Communication</option>
                            <option value="Mechanical">Mechanical Engineering</option>
                            <option value="Civil">Civil Engineering</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="semester">Current Semester *</label>
                        <select id="semester" class="form-control" required>
                            <option value="">-- Select Semester --</option>
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5">Semester 5</option>
                            <option value="6">Semester 6</option>
                            <option value="7">Semester 7</option>
                            <option value="8">Semester 8</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="phone">Contact Mobile Number *</label>
                    <input type="tel" id="phone" class="form-control" placeholder="10-digit mobile number" maxlength="10" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="password">Create Password *</label>
                        <input type="password" id="password" class="form-control" placeholder="Min. 8 characters" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="confirmPassword">Confirm Password *</label>
                        <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
                    Complete Registration
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="/login.html" style="font-weight: 600;">Sign In here</a></p>
                <div style="margin-top: 0.75rem;">
                    <a href="/" style="color: #94a3b8; font-size: 0.85rem;">
                        &larr; Back to Home Page
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleRegister(e) {
            e.preventDefault();
            alert('Registration simulated successfully! Redirecting to login.');
            window.location.href = '/login.html';
        }
    </script>
</body>
</html>
