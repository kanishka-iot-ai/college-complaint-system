<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Redressal Portal - Sign In</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20261101">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png?v=20261101">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png?v=20261101">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png?v=20261101">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%); min-height: 100vh;">

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <img src="/images/cu_logo.png?v=20261101" alt="CU Logo" class="brand-logo-card">
                <h1>Student Redressal Portal</h1>
                <p>Sign in with your University UID or institutional email to access grievance proceedings</p>
            </div>

            <div id="alertBox"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="email">University UID or Institutional Email</label>
                    <input type="text" id="email" class="form-control" placeholder="e.g. 26BAI10196 or student@cuchd.in" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
                    Sign In to Portal &rarr;
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an active grievance account? <a href="/register.html" style="font-weight: 600; color: var(--primary);">Register here</a></p>
                <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed var(--border);">
                    <a href="/admin_login.html" style="color: #0d9488; font-weight: 600; font-size: 0.9rem;">
                        Administrator Access Portal &rarr;
                    </a>
                </div>
                <div style="margin-top: 0.5rem;">
                    <a href="/" style="color: #94a3b8; font-size: 0.85rem;">
                        &larr; Back to Home Page
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');

            alertBox.innerHTML = '';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Verifying credentials...';

            fetch('/api/student/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier, password })
            })
            .then(res => res.json().then(data => ({ status: res.status, body: data })))
            .then(({ status, body }) => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Sign In to Portal &rarr;';

                if (status === 200 && body.success) {
                    localStorage.setItem('student_user', JSON.stringify(body.student));
                    window.location.href = '/student_dashboard.html';
                } else {
                    alertBox.innerHTML = '<div class="alert alert-danger" style="margin-bottom: 1.25rem;">' + (body.error || 'Authentication failed. Please verify your credentials.') + '</div>';
                }
            })
            .catch(err => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Sign In to Portal &rarr;';
                alertBox.innerHTML = '<div class="alert alert-danger" style="margin-bottom: 1.25rem;">Server connection error. Please try again.</div>';
            });
        }
    </script>
</body>
</html>
