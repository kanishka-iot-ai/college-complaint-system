<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Login - Chandigarh University</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%); min-height: 100vh;">

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <img src="/images/cu_logo.png" alt="CU Logo" class="brand-logo-card">
                <h1>Student Redressal Portal</h1>
                <p>Sign in with your University UID or institutional email to access grievance proceedings</p>
            </div>

            <div id="alertBox"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="email">University UID or Institutional Email</label>
                    <input type="text" id="email" class="form-control" value="26BAI10196" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" value="Cu@26BAI10196" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
                    Sign In to Portal &rarr;
                </button>
            </form>

            <div class="auth-footer">
                <p>Enrolled Student Account: <strong>26BAI10196</strong> (or <strong>26BAI10196@cuchd.in</strong>)</p>
                <div style="font-size: 0.8rem; color: #64748b; margin-top: 0.25rem;">Initial Password: <code>Cu@26BAI10196</code> (individual to each student)</div>
                <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed var(--border);">
                    <a href="/admin_login.html" style="color: #0d9488; font-weight: 600; font-size: 0.9rem;">
                        Administrator Access Portal &rarr;
                    </a>
                </div>
                <div style="margin-top: 0.5rem;">
                    <a href="/" style="color: #94a3b8; font-size: 0.85rem;">
                        &larr; Back to Home Page
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (email && password) {
                localStorage.setItem('student_email', email);
                window.location.href = '/student_dashboard.html';
            }
        }
    </script>
</body>
</html>
