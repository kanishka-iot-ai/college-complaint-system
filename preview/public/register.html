<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Grievance Redressal Portal</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20261101">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png?v=20261101">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png?v=20261101">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png?v=20261101">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%); min-height: 100vh;">

    <div class="auth-wrapper">
        <div class="auth-card wide">
            <div class="auth-header">
                <img src="/images/cu_logo.png?v=20261101" alt="CU Logo" class="brand-logo-card">
                <h1>Student Registration</h1>
                <p>Create your official student account to lodge grievances and track Action Taken Reports (ATRs)</p>
            </div>

            <div id="alertBox"></div>

            <form id="regForm" onsubmit="handleRegister(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="name">Full Name *</label>
                        <input type="text" id="name" class="form-control" placeholder="e.g. Rahul Sharma" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">College Email Address *</label>
                        <input type="email" id="email" class="form-control" placeholder="e.g. rahul@student.cuchd.in" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="department">Department / Branch *</label>
                        <select id="department" class="form-control" required>
                            <option value="">-- Select Department --</option>
                            <option value="Computer Science">Computer Science & Engineering</option>
                            <option value="Artificial Intelligence">Artificial Intelligence</option>
                            <option value="Cyber Security">Cyber Security</option>
                            <option value="Data Science">Data Science</option>
                            <option value="Cloud Computing">Cloud Computing</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Electronics">Electronics & Communication</option>
                            <option value="Mechanical">Mechanical Engineering</option>
                            <option value="Civil">Civil Engineering</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="semester">Current Semester *</label>
                        <select id="semester" class="form-control" required>
                            <option value="">-- Select Semester --</option>
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5">Semester 5</option>
                            <option value="6">Semester 6</option>
                            <option value="7">Semester 7</option>
                            <option value="8">Semester 8</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="phone">Contact Mobile Number *</label>
                    <input type="tel" id="phone" class="form-control" placeholder="10-digit mobile number" maxlength="10" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="password">Create Password *</label>
                        <input type="password" id="password" class="form-control" placeholder="Min. 8 characters" required minlength="8">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="confirmPassword">Confirm Password *</label>
                        <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required minlength="8">
                    </div>
                </div>

                <button type="submit" id="regBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
                    Complete Registration &rarr;
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="/login.html" style="font-weight: 600; color: var(--primary);">Sign In here</a></p>
                <div style="margin-top: 0.75rem;">
                    <a href="/" style="color: #94a3b8; font-size: 0.85rem;">
                        &larr; Back to Home Page
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const department = document.getElementById('department').value;
            const semester = document.getElementById('semester').value;
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const alertBox = document.getElementById('alertBox');
            const regBtn = document.getElementById('regBtn');

            alertBox.innerHTML = '';

            if (password !== confirmPassword) {
                alertBox.innerHTML = '<div class="alert alert-danger" style="margin-bottom: 1.25rem;">Passwords do not match. Please re-enter.</div>';
                return;
            }

            regBtn.disabled = true;
            regBtn.textContent = 'Registering account...';

            fetch('/api/student/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, department, semester, phone, password })
            })
            .then(res => res.json().then(data => ({ status: res.status, body: data })))
            .then(({ status, body }) => {
                regBtn.disabled = false;
                regBtn.innerHTML = 'Complete Registration &rarr;';

                if ((status === 200 || status === 201) && body.success) {
                    localStorage.setItem('student_user', JSON.stringify(body.student));
                    alertBox.innerHTML = '<div class="alert alert-success" style="margin-bottom: 1.25rem;">Registration completed successfully! Entering your dashboard...</div>';
                    setTimeout(() => {
                        window.location.href = '/student_dashboard.html';
                    }, 1000);
                } else {
                    alertBox.innerHTML = '<div class="alert alert-danger" style="margin-bottom: 1.25rem;">' + (body.error || 'Registration failed.') + '</div>';
                }
            })
            .catch(err => {
                regBtn.disabled = false;
                regBtn.innerHTML = 'Complete Registration &rarr;';
                alertBox.innerHTML = '<div class="alert alert-danger" style="margin-bottom: 1.25rem;">Server connection error. Please try again.</div>';
            });
        }
    </script>
</body>
</html>
